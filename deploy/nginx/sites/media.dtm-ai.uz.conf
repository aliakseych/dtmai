# Public read-only media: serves ONLY the media/ prefix of the S3 bucket (uploads/ stays private).
# Bucket name is hardcoded to match S3_BUCKET default (dtmai); keep them in sync.
map $upstream_http_content_type $media_disposition {
  default "attachment";
  ~^image/(?!svg) "inline";
  ~^audio/ "inline";
}
server {
  listen 80;
  server_name media.dtm-ai.uz;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name media.dtm-ai.uz;
  ssl_certificate /etc/letsencrypt/live/media.dtm-ai.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/media.dtm-ai.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'none'; sandbox" always;
  add_header Cross-Origin-Resource-Policy cross-origin always;
  add_header Content-Disposition $media_disposition always;
  add_header Cache-Control "public, max-age=86400" always;
  location / {
    limit_except GET HEAD { deny all; }
    # $uri is normalised (no ../, no %2e); prefix is forced, query string dropped.
    rewrite ^ /dtmai/media$uri break;
    proxy_pass http://rustfs:9000;
    proxy_set_header Host rustfs:9000;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-meta-*;
    proxy_hide_header x-amz-version-id;
    proxy_hide_header x-amz-server-side-encryption;
    proxy_hide_header Content-Disposition;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Cache-Control;
  }
}
