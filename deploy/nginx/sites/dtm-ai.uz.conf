server {
  listen 80;
  server_name dtm-ai.uz app.dtm-ai.uz;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name dtm-ai.uz app.dtm-ai.uz;
  ssl_certificate /etc/letsencrypt/live/dtm-ai.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dtm-ai.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Mini App is embedded by Telegram: no X-Frame-Options; CSP frame-ancestors allows Telegram clients only.
  # script-src/frame-src telegram: Login Widget (telegram.org script, oauth.telegram.org iframe). 'unsafe-inline' is required by the Next.js static export's inline bootstrap scripts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.dtm-ai.uz; frame-src https://oauth.telegram.org https://telegram.org; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
