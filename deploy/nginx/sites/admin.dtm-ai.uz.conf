server {
  listen 80;
  server_name admin.dtm-ai.uz;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name admin.dtm-ai.uz;
  ssl_certificate /etc/letsencrypt/live/dtm-ai.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dtm-ai.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://media.dtm-ai.uz; font-src 'self' data:; media-src 'self' https://media.dtm-ai.uz; connect-src 'self' https://api.dtm-ai.uz; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  location / {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
