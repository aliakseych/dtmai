server {
  listen 80;
  server_name api.dtm-ai.uz;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name api.dtm-ai.uz;
  ssl_certificate /etc/letsencrypt/live/dtm-ai.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dtm-ai.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Single upstream; /tg/webhook (Telegram) and /billing/click/* (Click prepare/complete) are public by design,
  # authenticated by secret token / md5 signature inside the app.
  location / {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location = /tg/webhook {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /billing/click/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
