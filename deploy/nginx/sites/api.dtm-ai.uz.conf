server {
  listen 80;
  server_name api.dtm-ai.uz;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name api.dtm-ai.uz;
  ssl_certificate /etc/letsencrypt/live/dtm-ai.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dtm-ai.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  # X-Forwarded-For is overwritten (never appended): the client-supplied header must not reach the app.
  # Single upstream; /tg/webhook (Telegram) and /v1/billing/click/* (Click prepare/complete) are public by design,
  # authenticated by secret token / md5 signature inside the app.
  # Credential endpoints: 5 req/min per IP, burst 5, excess answered 429 (limit_req_status in nginx.conf).
  location ~ ^/v1/identity/(login|register|password/forgot)$ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  # Admin ingestion upload: up to 50 files x 100 MB (UPLOAD_MAX_BYTES in v1/ingestion.py).
  location = /v1/admin/ingestion/batches/upload {
    client_max_body_size 500m;
    proxy_request_buffering off;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
  }
  location = /tg/webhook {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /v1/billing/click/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
