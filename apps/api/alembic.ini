[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = space
# One directory per module branch; add a line when adding a module.
version_locations = %(here)s/migrations/versions/identity %(here)s/migrations/versions/shared %(here)s/migrations/versions/catalog %(here)s/migrations/versions/bank %(here)s/migrations/versions/billing %(here)s/migrations/versions/lyceums %(here)s/migrations/versions/notify %(here)s/migrations/versions/ai %(here)s/migrations/versions/labeling %(here)s/migrations/versions/learning %(here)s/migrations/versions/assessment %(here)s/migrations/versions/gamification %(here)s/migrations/versions/study_plan %(here)s/migrations/versions/exam_info
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
