[project]
name = "dtmai-api"
version = "0.1.0"
description = "DTM AI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pydantic[email]>=2.9",
  "taskiq>=0.11",
  "taskiq-redis>=1.0",
  "redis>=5.2",
  "aiogram>=3.15",
  "httpx>=0.27",
  "openai>=1.55",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "structlog>=24.4",
  "boto3>=1.35",
  "python-multipart>=0.0.33",
  "uuid-utils>=0.9",
  "cryptography>=43",
  "pymupdf>=2.1",
  "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "aiosqlite>=0.20",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
